<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 1 - Logo Guess Game</title>
    <link rel="stylesheet" href="que.css">
</head>
<body>
    <div class="question">Find out which is the correct logo!</div>

    <div class="logos">
        
        <form action="#correct-msg">
            <button type="submit" class="invisible-btn"></button>
            <label>
                <img src="adidas_correct.png" alt="Correct Pepsi Logo" class="logo">
            </label>
        </form>

        
        <form action="#incorrect-msg">
            <button type="submit" class="invisible-btn"></button>
            <label>
                <img src="adidas_wrong.png" alt="Incorrect Pepsi Logo" class="logo">
            </label>
        </form>
    </div>

    <div id="correct-msg" class="message correct-msg">
        ✅ "Impossible is Nothing! You nailed it, Adidas champion! 🎉🔥"
    </div>
    
    <div id="incorrect-msg" class="message incorrect-msg">
        ❌ "Oops! Maybe you should 'Run Faster' to find the right logo! 😂🏃‍♂️"
    </div>
    
    <a href="que7.html" class="next-btn">Next Question ➡️</a>
</body>
</html>
